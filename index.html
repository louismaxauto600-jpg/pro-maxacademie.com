<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Introduction to AI | PRO-MAX ACADÉMIE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#301300,#000 65%);color:#ffad60;font-family:Arial,sans-serif}
header,footer{text-align:center;background:#000;padding:24px;border-bottom:1px solid #ff7900}
main{max-width:1000px;margin:auto;padding:25px}
h1,h2,h3{color:#ff7900}
p{line-height:1.8}
button,a.btn{display:inline-block;background:#000;color:#ff7900;border:1px solid #ff7900;border-radius:12px;padding:13px 20px;margin:5px;text-decoration:none;font-weight:bold;cursor:pointer}
button:hover,button.active,a.btn:hover{background:#ff7900;color:#000}
.hero{text-align:center;padding:30px 0}
.logo{width:110px;height:110px;border-radius:50%;object-fit:cover;border:2px solid #ff7900}
.card{background:linear-gradient(145deg,#201000,#000);border:1px solid #773600;border-radius:18px;padding:24px;margin:20px 0}
.progress{height:14px;background:#351500;border-radius:20px;overflow:hidden}
#bar{height:100%;background:#ff7900;width:0;transition:.3s}
input{accent-color:#ff7900}
label{display:block;padding:10px}
summary{cursor:pointer;color:#ff7900;font-weight:bold}
a{color:#ffad60}
</style>
</head>
<body>
<header>
<strong>PRO-MAX ACADÉMIE</strong>
<p>BSS1815 PRO-MAX DMP</p>
<button onclick="setLang('fr')" data-lang="fr">FRA</button>
<button onclick="setLang('en')" data-lang="en">ENG</button>
<button onclick="setLang('ht')" data-lang="ht">KRE</button>
</header>
<main>
<div class="hero">
<video class="logo" autoplay muted loop playsinline>
<source src="../../pro-max-dmp-II.mp4" type="video/mp4">
</video>
<h1>INTRODUCTION TO AI</h1>
<p id="subtitle"></p>
<a class="btn" href="../../index.html">ACADEMY HOME</a>
<a class="btn" href="../index.html">COURSES CENTER</a>
<a class="btn" href="../../student-portal/index.html">STUDENT PORTAL</a>
</div>
<div class="card">
<h3 id="progressTitle"></h3>
<div class="progress"><div id="bar"></div></div>
<p id="percentage">0%</p>
</div>
<div id="lessons"></div>
<div class="card">
<h2>QUIZ</h2>
<form id="quiz"></form>
<h3 id="result"></h3>
</div>
</main>
<footer>
<h3>PRO-MAX ACADÉMIE</h3>
<a href="mailto:bss1815promaxdmp@gmail.com">
bss1815promaxdmp@gmail.com
</a>
<p>BATI POU JODI A • PARE POU DEMEN</p>
</footer>
<script>
const T=(ht,fr,en)=>({ht,fr,en});
let lang="ht";
const lessons=[
{
title:T("Kisa AI ye?","Qu’est-ce que l’IA ?","What is AI?"),
body:T(
"Entèlijans atifisyèl se yon seri teknoloji ki pèmèt sistèm enfòmatik analize enfòmasyon, rekonèt modèl epi pwodwi repons. AI kapab ede moun ekri, tradui, fè rechèch ak òganize travay. Li pa toujou bay enfòmasyon ki kòrèk.",
"L’intelligence artificielle regroupe des technologies permettant aux systèmes informatiques d’analyser des informations, de reconnaître des modèles et de produire des réponses. Elle peut aider à rédiger, traduire, rechercher et organiser le travail. Ses réponses ne sont pas toujours exactes.",
"Artificial intelligence includes technologies that enable computer systems to analyze information, recognize patterns and generate responses. AI can assist with writing, translation, research and organization. Its answers are not always accurate."),
practice:T(
"Bay twa egzanp itilizasyon AI nan lavi chak jou.",
"Donnez trois exemples d’utilisation quotidienne de l’IA.",
"Give three examples of everyday AI use.")
},
{
title:T("AI jeneratif","IA générative","Generative AI"),
body:T(
"AI jeneratif kapab pwodwi tèks, imaj, odyo, videyo ak kòd. Li itilize modèl li aprann nan done pou jenere nouvo kontni. Rezilta yo bezwen revizyon imen.",
"L’IA générative peut produire du texte, des images, de l’audio, des vidéos et du code. Elle utilise des modèles appris à partir de données. Les résultats nécessitent une vérification humaine.",
"Generative AI can produce text, images, audio, video and code. It uses patterns learned from data to generate content. Its outputs require human review."),
practice:T(
"Ekri yon demann pou AI kreye yon anons pwofesyonèl.",
"Rédigez une demande de création d’annonce professionnelle.",
"Write a request for AI to create a professional announcement.")
},
{
title:T("Prompt Engineering","Ingénierie des prompts","Prompt Engineering"),
body:T(
"Yon prompt se enstriksyon ou bay AI. Yon bon prompt presize objektif, kontèks, fòma, lang ak limit travay la. Pa egzanp: ekri yon anons an kreyòl, nan 80 mo, pou envite elèv nan yon fòmasyon.",
"Un prompt est une instruction donnée à l’IA. Un bon prompt précise l’objectif, le contexte, le format, la langue et les contraintes. Par exemple : rédigez une annonce de 80 mots en créole pour inviter des étudiants à une formation.",
"A prompt is an instruction given to AI. An effective prompt specifies the goal, context, format, language and constraints. For example: write an 80-word announcement in Haitian Creole inviting students to a training session."),
practice:T(
"Ekri yon prompt ki genyen objektif, kontèks ak fòma.",
"Rédigez un prompt avec objectif, contexte et format.",
"Write a prompt containing a goal, context and format.")
},
{
title:T("Verifikasyon enfòmasyon","Vérification des informations","Information verification"),
body:T(
"AI kapab pwodwi enfòmasyon ki pa egzak. Verifye non, dat, estatistik ak deklarasyon enpòtan avèk sous serye. Pa pibliye yon enfòmasyon sèlman paske AI prezante li avèk konfyans.",
"L’IA peut produire des informations inexactes. Vérifiez les noms, dates, statistiques et affirmations importantes auprès de sources fiables. Ne publiez pas une information uniquement parce que l’IA la présente avec assurance.",
"AI can generate inaccurate information. Verify names, dates, statistics and important claims against reliable sources. Do not publish information simply because AI presents it confidently."),
practice:T(
"Chwazi yon enfòmasyon epi verifye li avèk de sous serye.",
"Choisissez une information et vérifiez-la auprès de deux sources fiables.",
"Choose a claim and verify it using two reliable sources.")
},
{
title:T("Etik ak sekirite","Éthique et sécurité","Ethics and safety"),
body:T(
"Pa pataje modpas, nimewo sekirite sosyal oswa dokiman konfidansyèl san otorizasyon. Respekte dwa otè, vi prive ak konsantman moun. Itilize AI kòm yon zouti asistans, pa kòm yon ranplasman otomatik pou jijman imen.",
"Ne partagez pas de mots de passe, de numéros de sécurité sociale ou de documents confidentiels sans autorisation. Respectez les droits d’auteur, la vie privée et le consentement. Utilisez l’IA comme outil d’assistance.",
"Do not share passwords, Social Security numbers or confidential documents without authorization. Respect copyright, privacy and consent. Use AI as an assistance tool rather than an automatic replacement for human judgment."),
practice:T(
"Idantifye twa kalite enfòmasyon ou dwe pwoteje.",
"Identifiez trois types d’informations à protéger.",
"Identify three types of information that should be protected.")
},
{
title:T("Pwojè pratik","Projet pratique","Practical project"),
body:T(
"Prepare yon pwojè kote AI ede w rezoud yon pwoblèm reyèl. Defini objektif la, ekri prompt ou, analize rezilta a, verifye enfòmasyon yo epi amelyore travay final la.",
"Préparez un projet dans lequel l’IA vous aide à résoudre un problème réel. Définissez l’objectif, rédigez votre prompt, analysez et vérifiez les résultats, puis améliorez le travail final.",
"Prepare a project in which AI helps solve a real problem. Define your goal, write your prompt, analyze and verify the results, then improve the final output."),
practice:T(
"Prepare yon dokiman yon paj ki prezante pwojè ou.",
"Préparez un document d’une page présentant votre projet.",
"Prepare a one-page document presenting your project.")
}
];

const questions=[
{
q:T("Èske AI kapab fè erè?","L’IA peut-elle se tromper ?","Can AI make mistakes?"),
a:[T("Wi","Oui","Yes"),T("Non","Non","No")],correct:0
},
{
q:T("Kisa yon bon prompt bezwen?","Que faut-il pour un bon prompt ?","What does a good prompt need?"),
a:[T("Mo o aza","Des mots aléatoires","Random words"),T("Enstriksyon klè","Des instructions claires","Clear instructions")],correct:1
},
{
q:T("Èske ou dwe verifye enfòmasyon AI bay?","Faut-il vérifier les informations de l’IA ?","Should AI information be verified?"),
a:[T("Wi","Oui","Yes"),T("Non","Non","No")],correct:0
},
{
q:T("Èske ou dwe pataje modpas ou?","Faut-il partager son mot de passe ?","Should you share your password?"),
a:[T("Wi","Oui","Yes"),T("Non","Non","No")],correct:1
},
{
q:T("AI jeneratif kapab kreye kontni?","L’IA générative peut-elle créer du contenu ?","Can generative AI create content?"),
a:[T("Wi","Oui","Yes"),T("Non","Non","No")],correct:0
}
];

let completed=[];
try{
completed=JSON.parse(localStorage.getItem("promax-ai-lessons")||"[]");
if(!Array.isArray(completed))completed=[];
}catch(e){completed=[]}

function updateProgress(){
const percent=Math.round(
lessons.filter((l,i)=>completed.includes(i)).length/lessons.length*100
);
document.getElementById("bar").style.width=percent+"%";
document.getElementById("percentage").textContent=percent+"%";
try{
localStorage.setItem("promax-ai-lessons",JSON.stringify(completed));
localStorage.setItem("promaxCourseProgress_ai",String(percent));
}catch(e){}
}

function markLesson(i,checked){
completed=completed.filter(n=>n!==i);
if(checked)completed.push(i);
updateProgress();
}

function setLang(value){
lang=value;
document.documentElement.lang=lang;
document.querySelectorAll("[data-lang]").forEach(b=>{
b.classList.toggle("active",b.dataset.lang===lang);
});

document.getElementById("subtitle").textContent=
T("6 leson • Egzèsis • Evalyasyon",
"6 leçons • Exercices • Évaluation",
"6 lessons • Exercises • Assessment")[lang];

document.getElementById("progressTitle").textContent=
T("PWOGRÈ OU","VOTRE PROGRESSION","YOUR PROGRESS")[lang];

document.getElementById("lessons").innerHTML=
lessons.map((l,i)=>`
<article class="card">
<h2>MODULE ${String(i+1).padStart(2,"0")}</h2>
<details>
<summary>${l.title[lang]}</summary>
<p>${l.body[lang]}</p>
<h3>${T("EGZÈSIS","EXERCICE","EXERCISE")[lang]}</h3>
<p>${l.practice[lang]}</p>
<label>
<input type="checkbox"
${completed.includes(i)?"checked":""}
onchange="markLesson(${i},this.checked)">
${T("Leson fini","Leçon terminée","Lesson completed")[lang]}
</label>
</details>
</article>`).join("");

document.getElementById("quiz").innerHTML=
questions.map((q,i)=>`
<div class="card">
<h3>${i+1}. ${q.q[lang]}</h3>
${q.a.map((a,j)=>`
<label>
<input type="radio" name="q${i}" value="${j}" required>
${a[lang]}
</label>`).join("")}
</div>`).join("")+
`<button type="submit">
${T("VERIFYE REPONS YO","CORRIGER","CHECK ANSWERS")[lang]}
</button>`;

document.getElementById("result").textContent="";
updateProgress();
}

document.getElementById("quiz").addEventListener("submit",e=>{
e.preventDefault();
const data=new FormData(e.target);
let score=0;
questions.forEach((q,i)=>{
if(Number(data.get("q"+i))===q.correct)score++;
});
const percent=Math.round(score/questions.length*100);
document.getElementById("result").textContent=
T("REZILTA","RÉSULTAT","RESULT")[lang]+
": "+score+"/"+questions.length+" — "+percent+"%";
try{
localStorage.setItem("promaxQuizScore_ai",String(percent));
}catch(e){}
});

setLang("ht");
</script>
</body>
</html>
