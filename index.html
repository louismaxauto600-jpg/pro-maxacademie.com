let lang="en";
let currentExam=null;
let submitted=false;
let lastAnswers=[];

const $=id=>document.getElementById(id);
const tr=key=>words[key][lang];

try{
 const saved=localStorage.getItem("promax-language");
 if(["en","fr","ht"].includes(saved))lang=saved;
}catch(e){}

function readHistory(){
 try{
  const data=JSON.parse(
   localStorage.getItem("promax-assessment-history")||"[]"
  );
  return Array.isArray(data)?data.filter(
   x=>x&&typeof x.score==="number"&&
   exams.some(e=>e.id===x.id)
  ):[];
 }catch(e){return []}
}

function renderHistory(){
 const history=readHistory();

 $("attemptCount").textContent=history.length;

 const average=history.length?
 Math.round(history.reduce((a,b)=>a+b.score,0)/history.length):0;

 $("averageScore").textContent=average+"%";
 $("history").replaceChildren();

 if(!history.length){
  $("history").textContent=tr("empty");
  return;
 }

 history.slice().reverse().forEach(item=>{
  const exam=exams.find(e=>e.id===item.id);
  const row=document.createElement("div");
  row.className="history-row";

  const title=document.createElement("strong");
  title.textContent=exam.title[lang];

  const score=document.createElement("span");
  score.textContent=item.score+"% — "+
   new Date(item.date).toLocaleDateString(lang==="ht"?"fr":lang);

  row.append(title,score);
  $("history").appendChild(row);
 });
}

function renderCards(){
 $("cards").innerHTML=exams.map(exam=>`
  <article class="card">
   <div class="icon">${exam.icon}</div>
   <h3>${exam.title[lang]}</h3>
   <p>${exam.questions.length} QUESTIONS</p>
   <button data-exam="${exam.id}">
    ${tr("start")}
   </button>
  </article>
 `).join("");
}

function startExam(id){
 currentExam=exams.find(e=>e.id===id);
 if(!currentExam)return;

 submitted=false;
 lastAnswers=[];
 $("assessmentList").hidden=true;
 $("examPanel").hidden=false;
 $("result").hidden=true;

 renderExam();
 $("examPanel").scrollIntoView({behavior:"smooth"});
}

function renderExam(){
 if(!currentExam)return;

 $("examTitle").textContent=currentExam.title[lang];

 $("examForm").innerHTML=currentExam.questions.map((q,i)=>`
  <fieldset>
   <legend>${i+1}. ${q.question[lang]}</legend>
   ${q.options.map((option,j)=>`
    <label class="option">
     <input type="radio"
      name="question${i}"
      value="${j}"
      ${lastAnswers[i]===j?"checked":""}
      ${submitted?"disabled":"required"}>
     ${option[lang]}
    </label>
   `).join("")}
  </fieldset>
 `).join("")+
 (submitted?"":`
  <button type="submit" class="primary">
   ${tr("submit")}
  </button>
 `);
}

function showResult(){
 const correct=currentExam.questions.reduce(
  (total,q,i)=>total+(lastAnswers[i]===q.correct?1:0),0
 );

 const score=Math.round(
  correct/currentExam.questions.length*100
 );

 $("result").hidden=false;

 $("result").innerHTML=`
  <h3>${tr("score")}</h3>
  <div class="score">${score}%</div>
  <p>${tr("correct")}: ${correct}/${currentExam.questions.length}</p>
  <h3>${tr("review")}</h3>
  ${currentExam.questions.map((q,i)=>`
   <p>${i+1}. ${lastAnswers[i]===q.correct?"✓":"✗"}
    ${q.options[q.correct][lang]}
   </p>
  `).join("")}
  <button id="retryBtn">${tr("retry")}</button>
 `;

 $("retryBtn").onclick=()=>startExam(currentExam.id);

 return score;
}

$("examForm").addEventListener("change",e=>{
 if(!e.target.matches("input[type=radio]"))return;
 const index=Number(e.target.name.replace("question",""));
 lastAnswers[index]=Number(e.target.value);
});

$("examForm").addEventListener("submit",e=>{
 e.preventDefault();

 if(submitted||!currentExam)return;

 const data=new FormData(e.target);

 lastAnswers=currentExam.questions.map(
  (q,i)=>Number(data.get("question"+i))
 );

 submitted=true;

 const score=showResult();

 renderExam();

 try{
  const history=readHistory();

  history.push({
   id:currentExam.id,
   score:score,
   date:new Date().toISOString()
  });

  localStorage.setItem(
   "promax-assessment-history",
   JSON.stringify(history)
  );

 }catch(e){
  const warning=document.createElement("p");
  warning.textContent=tr("storageError");
  $("result").appendChild(warning);
 }

 renderHistory();
 $("result").scrollIntoView({behavior:"smooth"});
});

$("cards").addEventListener("click",e=>{
 const btn=e.target.closest("[data-exam]");
 if(btn)startExam(btn.dataset.exam);
});

$("backBtn").addEventListener("click",()=>{
 currentExam=null;
 $("examPanel").hidden=true;
 $("assessmentList").hidden=false;
 $("assessmentList").scrollIntoView({behavior:"smooth"});
});

function setLanguage(value){
 lang=["en","fr","ht"].includes(value)?value:"en";
 document.documentElement.lang=lang;

 document.querySelectorAll("[data-t]").forEach(el=>{
  el.textContent=tr(el.dataset.t);
 });

 document.querySelectorAll("[data-lang]").forEach(btn=>{
  const active=btn.dataset.lang===lang;
  btn.classList.toggle("active",active);
  btn.setAttribute("aria-pressed",String(active));
 });

 try{
  localStorage.setItem("promax-language",lang);
 }catch(e){}

 renderCards();
 renderHistory();

 if(currentExam){
  renderExam();
  if(submitted)showResult();
 }
}

document.querySelectorAll("[data-lang]").forEach(btn=>{
 btn.addEventListener("click",()=>{
  setLanguage(btn.dataset.lang);
 });
});

setLanguage(lang);

</script>
</body>
</html>
