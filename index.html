<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRO-MAX ACADÉMIE | Fòme Jodi a Pou Dirije Demen</title>

<meta name="description" content="PRO-MAX ACADÉMIE — Fòmasyon, entèlijans atifisyèl, inovasyon, lidèchip ak DEVAN DEVAN NÈT™.">
<meta name="theme-color" content="#000000">

<style>
:root{
  --black:#000000;
  --black2:#080300;
  --black3:#0d0500;
  --orange:#ff7900;
  --orange2:#ff8c1a;
  --orange3:#ffad4d;
  --orangeDark:#9e4300;
  --border:rgba(255,121,0,.28);
  --borderStrong:rgba(255,121,0,.70);
  --glow:0 0 18px rgba(255,121,0,.35);
  --glowStrong:0 0 15px rgba(255,121,0,.70),0 0 38px rgba(255,121,0,.34);
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  overflow-x:hidden;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--orange3);
  background:
    radial-gradient(circle at 20% 20%,rgba(255,121,0,.14),transparent 34%),
    radial-gradient(circle at 80% 70%,rgba(255,121,0,.09),transparent 40%),
    linear-gradient(180deg,#000000 0%,#090400 45%,#000000 100%);
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  background-image:
    linear-gradient(rgba(255,121,0,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,121,0,.025) 1px,transparent 1px);
  background-size:44px 44px;
}
a{color:inherit;text-decoration:none}
button{font:inherit}
.container{width:min(1220px,calc(100% - 28px));margin:auto}

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(0,0,0,.97);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(14px);
}
.header-inner{
  min-height:82px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}
.brand{display:flex;align-items:center;gap:12px}
.brand-video{
  width:58px;height:58px;border-radius:50%;object-fit:cover;background:#000;
  border:2px solid var(--orange);box-shadow:var(--glow);
}
.brand-text strong{
  display:block;color:var(--orange);font-size:1rem;font-weight:1000;line-height:1;letter-spacing:.02em;
}
.brand-text span{
  display:block;margin-top:6px;color:var(--orange3);font-size:.58rem;font-weight:900;text-transform:uppercase;
}
.header-actions{display:flex;align-items:center;gap:10px}
.welcome-btn{
  padding:10px 17px;border:1px solid var(--borderStrong);border-radius:999px;
  color:var(--orange);background:#000;font-size:.70rem;font-weight:1000;text-transform:uppercase;transition:.25s;
}
.welcome-btn:hover{color:#000;background:var(--orange)}
.lang-switch{
  display:flex;gap:3px;padding:3px;border:1px solid var(--border);border-radius:999px;background:#000;
}
.lang-btn{
  border:0;border-radius:999px;padding:9px 13px;min-width:46px;cursor:pointer;background:#000;
  color:var(--orange3);font-size:.68rem;font-weight:1000;
}
.lang-btn.active{background:var(--orange);color:#000}

.hero{
  min-height:calc(100vh - 82px);
  padding:58px 0 75px;
  text-align:center;
}
.platform-label{
  color:var(--orange);font-size:.72rem;font-weight:1000;letter-spacing:.20em;text-transform:uppercase;
}

.globe-wrap{
  position:relative;width:min(88vw,470px);aspect-ratio:1;margin:34px auto 0;
  display:grid;place-items:center;filter:drop-shadow(0 0 35px rgba(255,121,0,.25));
}
.globe-sphere{
  position:absolute;width:67%;height:67%;overflow:hidden;border-radius:50%;
  border:1px solid rgba(255,121,0,.75);
  background:
    radial-gradient(circle at 31% 24%,rgba(255,173,77,.55),transparent 22%),
    radial-gradient(circle at 65% 65%,rgba(255,121,0,.24),transparent 46%),
    #080300;
  box-shadow:
    inset -30px -30px 65px rgba(0,0,0,.95),
    inset 15px 14px 45px rgba(255,121,0,.20),
    0 0 35px rgba(255,121,0,.55),
    0 0 100px rgba(255,121,0,.18);
}
.world-map{
  position:absolute;inset:-6%;width:112%;height:112%;
  animation:worldTurn 18s linear infinite;
}
@keyframes worldTurn{
  from{transform:translateX(-7%) rotate(0deg)}
  to{transform:translateX(7%) rotate(360deg)}
}
.globe-grid{
  position:absolute;inset:0;width:100%;height:100%;
  animation:gridSpin 20s linear infinite;
}
@keyframes gridSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.globe-shine{
  position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 27% 21%,rgba(255,173,77,.44),transparent 28%);
  pointer-events:none;
}
.orbit{position:absolute;border-radius:50%;pointer-events:none}
.orbit-one{
  width:84%;height:84%;border:2px solid rgba(255,121,0,.45);
  border-left-color:transparent;border-right-color:transparent;
  transform:rotateX(68deg) rotateZ(-14deg);
  animation:orbitOne 8s linear infinite;
}
.orbit-two{
  width:82%;height:82%;border:1px solid rgba(255,121,0,.50);
  border-top-color:var(--orange);border-bottom-color:var(--orange);
  transform:rotateY(65deg) rotateZ(18deg);
  animation:orbitTwo 10s linear infinite;
}
@keyframes orbitOne{
  from{transform:rotateX(68deg) rotateZ(-14deg) rotate(0deg)}
  to{transform:rotateX(68deg) rotateZ(-14deg) rotate(360deg)}
}
@keyframes orbitTwo{
  from{transform:rotateY(65deg) rotateZ(18deg) rotate(360deg)}
  to{transform:rotateY(65deg) rotateZ(18deg) rotate(0deg)}
}

.academy-ring{
  position:absolute;inset:0;width:100%;height:100%;overflow:visible;
  animation:textOrbit 24s linear infinite;
}
.ring-text{fill:var(--orange);font-size:8px;font-weight:1000;letter-spacing:2px}
@keyframes textOrbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.globe-center{
  position:absolute;z-index:20;width:118px;height:118px;display:grid;place-items:center;
  border-radius:50%;border:2px solid var(--orange);
  background:radial-gradient(circle,rgba(255,121,0,.14),#000 65%);
  box-shadow:var(--glowStrong);
}
.globe-center strong{display:block;color:var(--orange);font-size:1.30rem;font-weight:1000}
.globe-center span{
  display:block;margin-top:6px;color:var(--orange3);font-size:.50rem;font-weight:1000;letter-spacing:.10em;
}

.glow-dot{
  position:absolute;z-index:30;width:9px;height:9px;border-radius:50%;
  background:var(--orange);box-shadow:0 0 17px var(--orange);
}
.dot1{top:13%;right:20%;animation:pulse 1.5s infinite}
.dot2{bottom:15%;left:18%;animation:pulse 2s infinite}
.dot3{top:51%;left:2%;animation:pulse 1.8s infinite}
@keyframes pulse{
  0%,100%{opacity:.40;transform:scale(.65)}
  50%{opacity:1;transform:scale(1.5)}
}

.hero-slogan{
  margin-top:22px;color:var(--orange);font-size:clamp(1.7rem,5vw,3.2rem);
  font-weight:1000;line-height:1;text-transform:uppercase;
}
.hero-description{
  max-width:760px;margin:19px auto 0;color:var(--orange3);font-size:1rem;line-height:1.75;
}

.hero-actions{
  display:flex;justify-content:center;align-items:stretch;flex-wrap:wrap;gap:13px;margin-top:32px;
}
.btn{
  position:relative;min-height:54px;padding:13px 23px;display:inline-flex;align-items:center;justify-content:center;
  gap:7px;border-radius:999px;border:2px solid var(--orange);text-transform:uppercase;
  font-size:.75rem;font-weight:1000;letter-spacing:.03em;transition:.25s ease;
}
.btn:hover{transform:translateY(-3px);box-shadow:var(--glowStrong)}
.btn-primary{background:var(--orange);color:#000}
.btn-outline{background:#000;color:var(--orange)}

.btn-ddn{
  min-width:260px;overflow:hidden;flex-direction:column;color:var(--orange);
  background:linear-gradient(135deg,#000,rgba(255,121,0,.16),#000);
  animation:ddnGlow 2.5s ease-in-out infinite;
}
.btn-ddn strong{position:relative;z-index:2}
.btn-ddn small{
  position:relative;z-index:2;margin-top:2px;color:var(--orange3);font-size:.51rem;letter-spacing:.08em;
}
.btn-ddn::before{
  content:"";position:absolute;top:-100%;left:-70%;width:40%;height:300%;transform:rotate(25deg);
  background:linear-gradient(90deg,transparent,rgba(255,121,0,.30),transparent);
  animation:sweep 3.2s infinite;
}
@keyframes ddnGlow{
  0%,100%{box-shadow:0 0 12px rgba(255,121,0,.30)}
  50%{box-shadow:0 0 25px rgba(255,121,0,.72),0 0 50px rgba(255,121,0,.20)}
}
@keyframes sweep{0%{left:-70%}60%,100%{left:135%}}

.stats-grid{
  margin-top:58px;display:grid;grid-template-columns:repeat(4,1fr);gap:15px;
}
.stat-card{
  min-height:140px;padding:22px;border:1px solid var(--border);border-radius:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at top,rgba(255,121,0,.13),transparent 52%),#050200;
  transition:.3s;
}
.stat-card:hover{transform:translateY(-5px);border-color:var(--orange);box-shadow:var(--glow)}
.stat-value{color:var(--orange);font-size:2rem;font-weight:1000}
.stat-label{
  margin-top:8px;color:var(--orange3);font-size:.80rem;font-weight:900;text-transform:uppercase;
}

.section{
  padding:90px 0;border-top:1px solid rgba(255,121,0,.10);text-align:center;
}
.eyebrow{
  color:var(--orange);font-size:.70rem;font-weight:1000;letter-spacing:.18em;text-transform:uppercase;
}
.section-title{
  margin-top:11px;color:var(--orange);font-size:clamp(2rem,6vw,3.8rem);
  font-weight:1000;line-height:.95;text-transform:uppercase;
}
.section-desc{
  max-width:720px;margin:17px auto 0;color:var(--orange3);line-height:1.75;
}

.course-grid{
  margin-top:45px;display:grid;grid-template-columns:repeat(3,1fr);gap:17px;
}
.course-card{
  min-height:250px;padding:25px;display:flex;flex-direction:column;text-align:left;
  border:1px solid var(--border);border-radius:19px;
  background:linear-gradient(145deg,#000,#0b0400);transition:.3s;
}
.course-card:hover{transform:translateY(-5px);border-color:var(--orange);box-shadow:var(--glow)}
.course-icon{color:var(--orange);font-size:2rem;font-weight:1000}
.course-card h3{margin-top:20px;color:var(--orange);font-size:1rem;text-transform:uppercase}
.course-card p{margin-top:12px;color:var(--orange3);line-height:1.6;font-size:.88rem}
.course-btn{
  margin-top:auto;padding-top:20px;color:var(--orange);font-size:.72rem;font-weight:1000;text-transform:uppercase;
}

.ddn-section{
  position:relative;overflow:hidden;margin-top:45px;padding:45px;
  border:1px solid var(--borderStrong);border-radius:26px;text-align:left;
  background:
    radial-gradient(circle at 78% 30%,rgba(255,121,0,.19),transparent 33%),
    linear-gradient(135deg,#000,#0d0500,#000);
  box-shadow:var(--glow);
}
.ddn-badge{
  display:inline-flex;padding:7px 12px;border:1px solid var(--orange);
  border-radius:999px;color:var(--orange);font-size:.63rem;font-weight:1000;
}
.ddn-section h2{margin-top:18px;color:var(--orange);font-size:clamp(2.2rem,7vw,5rem);line-height:.88}
.ddn-section h3{margin-top:15px;color:var(--orange3);font-size:1rem;text-transform:uppercase}
.ddn-section p{max-width:760px;margin-top:18px;color:var(--orange3);line-height:1.75}

.student-grid{
  margin-top:45px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;
}
.student-card{
  padding:25px 18px;min-height:185px;border:1px solid var(--border);border-radius:18px;
  background:#050200;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:.3s;
}
.student-card:hover{transform:translateY(-5px);border-color:var(--orange);box-shadow:var(--glow)}
.student-icon{color:var(--orange);font-size:2rem}
.student-card strong{margin-top:15px;color:var(--orange);text-transform:uppercase}
.student-card span{margin-top:9px;color:var(--orange3);font-size:.80rem;line-height:1.5}

.final-cta{padding:80px 0 100px;text-align:center}
.final-box{
  padding:55px 25px;border:1px solid var(--orange);border-radius:28px;
  background:radial-gradient(circle,rgba(255,121,0,.15),transparent 48%),#000;
  box-shadow:var(--glow);
}
.final-box h2{color:var(--orange);font-size:clamp(2.3rem,7vw,5rem);line-height:.9}
.final-box p{max-width:680px;margin:22px auto 0;color:var(--orange3);line-height:1.7}

footer{
  padding:42px 0;border-top:1px solid var(--border);background:#000;text-align:center;
}
.footer-title{color:var(--orange);font-weight:1000}
.footer-info{margin-top:9px;color:var(--orange3);line-height:1.65;font-size:.78rem}

/* ================= PAYMENT & CERTIFICATION ================= */
.pay-rule{
  max-width:900px;margin:24px auto 0;padding:16px 18px;border:1px solid var(--borderStrong);
  border-radius:15px;background:rgba(255,121,0,.06);color:var(--orange2);font-weight:1000;line-height:1.55;
  text-align:center;font-size:.85rem;
}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:45px;text-align:left}
.pay-card{
  border:1px solid var(--border);border-radius:20px;padding:24px;
  background:linear-gradient(145deg,#000,#0b0400);
}
.pay-card h3{color:var(--orange);font-size:1.1rem;text-transform:uppercase}
.pay-sub{margin-top:8px;font-size:.86rem;line-height:1.55;color:var(--orange3)}
.pay-field{margin-top:16px}
.pay-field label{display:block;margin-bottom:7px;color:var(--orange2);font-size:.72rem;font-weight:900;text-transform:uppercase}
.pay-field input,.pay-field select,.pay-field textarea{
  width:100%;border:1px solid var(--borderStrong);border-radius:12px;background:#000;
  color:var(--orange3);padding:12px 13px;outline:none;font:inherit;
}
.pay-field input:focus,.pay-field select:focus,.pay-field textarea:focus{box-shadow:var(--glow);border-color:var(--orange)}
.pay-field textarea{min-height:96px;resize:vertical}
.pay-methods{margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pay-method{
  border:1px solid var(--border);border-radius:14px;padding:14px;background:#050200;
  cursor:pointer;display:flex;align-items:center;gap:9px;transition:.25s
}
.pay-method:hover,.pay-method.active{border-color:var(--orange);box-shadow:var(--glow)}
.pay-method input{width:auto}
.pay-method strong{color:var(--orange);font-size:.76rem;display:block}
.pay-method span{display:block;margin-top:3px;font-size:.64rem}
.pay-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.pay-btn{
  border:2px solid var(--orange);border-radius:999px;padding:11px 18px;
  font-weight:1000;text-transform:uppercase;font-size:.72rem;cursor:pointer;font-family:inherit;
}
.pay-btn-primary{background:var(--orange);color:#000}
.pay-btn-secondary{background:#000;color:var(--orange)}
.pay-btn:hover{box-shadow:var(--glowStrong);transform:translateY(-1px)}
.pay-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.pay-metric{border:1px solid var(--border);border-radius:15px;padding:16px;text-align:center;background:#050200}
.pay-metric strong{display:block;color:var(--orange);font-size:1.3rem}
.pay-metric span{display:block;margin-top:6px;font-size:.66rem;text-transform:uppercase;font-weight:900}
.pay-progress-wrap{margin-top:22px}
.pay-progress-track{height:16px;border:1px solid var(--border);border-radius:999px;background:#140700;overflow:hidden}
.pay-progress-bar{width:0;height:100%;background:var(--orange);transition:.3s ease}
.pay-progress-label{display:flex;justify-content:space-between;gap:10px;margin-top:9px;font-size:.76rem;font-weight:900}
.pay-installments{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:18px}
.pay-installment{border:1px solid var(--border);border-radius:14px;padding:13px 8px;text-align:center;background:#050200}
.pay-installment.paid{border-color:var(--orange);box-shadow:var(--glow)}
.pay-installment strong{display:block;color:var(--orange)}
.pay-installment span{display:block;margin-top:6px;font-size:.66rem}
.pay-status{margin-top:20px;padding:18px;border:1px solid var(--borderStrong);border-radius:16px;background:#050200}
.pay-status strong{color:var(--orange);font-size:1.02rem}
.pay-status p{margin-top:8px;line-height:1.55;font-size:.84rem}
.pay-check{
  display:flex;align-items:center;gap:10px;margin-top:13px;padding:13px;
  border:1px solid var(--border);border-radius:12px;background:#050200
}
.pay-check input{width:auto}
.pay-check label{margin:0;text-transform:none;font-size:.82rem;color:var(--orange3)}
.pay-full{grid-column:1/-1}
.pay-note{margin-top:18px;padding:14px;border-left:4px solid var(--orange);background:rgba(255,121,0,.06);line-height:1.6;font-size:.86rem}
.pay-history{margin-top:20px;overflow:auto}
.pay-table{width:100%;min-width:850px;border-collapse:collapse}
.pay-table th,.pay-table td{padding:12px;border-bottom:1px solid var(--border);text-align:left;font-size:.8rem}
.pay-table th{color:var(--orange);text-transform:uppercase;background:#080300}
.pay-table td{color:var(--orange3)}
.pay-message{margin-top:18px;padding:18px;border:1px solid var(--borderStrong);border-radius:16px;background:#000}
.pay-message strong{color:var(--orange)}
.pay-message pre{margin-top:10px;white-space:pre-wrap;word-break:break-word;font-family:inherit;line-height:1.6;color:var(--orange3);font-size:.82rem}

@media(max-width:900px){
  .pay-grid{grid-template-columns:1fr}
  .pay-metrics{grid-template-columns:repeat(2,1fr)}
  .pay-methods{grid-template-columns:1fr}
  .pay-installments{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:520px){
  .pay-metrics{grid-template-columns:1fr 1fr}
  .pay-installments{grid-template-columns:1fr}
}

@media(max-width:900px){
  .course-grid{grid-template-columns:repeat(2,1fr)}
  .student-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:650px){
  .header-inner{min-height:72px}
  .brand-video{width:48px;height:48px}
  .brand-text strong{font-size:.82rem}
  .brand-text span{font-size:.50rem}
  .welcome-btn{display:none}
  .lang-btn{padding:8px 9px}
  .hero{padding-top:38px}
  .globe-wrap{width:min(94vw,420px)}
  .globe-center{width:94px;height:94px}
  .globe-center strong{font-size:1rem}
  .ring-text{font-size:7px}
  .hero-actions{display:grid;grid-template-columns:1fr}
  .btn{width:100%}
  .btn-ddn{min-width:0}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .course-grid,.student-grid{grid-template-columns:1fr}
  .ddn-section{padding:30px 22px}
}
</style>
</head>

<body>

<header>
<div class="container header-inner">

<a href="#home" class="brand">
  <video class="brand-video" autoplay muted loop playsinline preload="metadata">
    <source src="pro-max-academie-II.mp4" type="video/mp4">

  <div class="brand-text">
    <strong>PRO-MAX ACADÉMIE</strong>

    </span>
  </div>
</a>

<div class="header-actions">

  <a
    href="#home"
    class="welcome-btn"
    data-ht="BYENVINI"
    data-fr="BIENVENUE"
    data-en="WELCOME">
    BYENVINI
  </a>

  <div class="lang-switch" aria-label="Language selector">
    <button type="button" class="lang-btn" data-lang="fr">FRA</button>
    <button type="button" class="lang-btn" data-lang="en">ENG</button>
    <button type="button" class="lang-btn active" data-lang="ht">KRE</button>

</div>
</div>
</header>
