<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO-MAX ACADÉMIE | Courses</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--orange:#ff6500;--orange2:#ff8a3d;--border:rgba(255,101,0,.35)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(circle at 50% 0,rgba(255,101,0,.14),transparent 32%),linear-gradient(180deg,#000,#0b0300,#000);color:var(--orange2);font-family:Arial,Helvetica,sans-serif}
header{position:sticky;top:0;z-index:1000;background:#000;border-bottom:2px solid var(--orange)}
.nav{max-width:1350px;margin:auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:15px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:64px;height:64px;border:2px solid var(--orange);border-radius:50%;overflow:hidden;background:#000}
.logo video{width:100%;height:100%;object-fit:cover;display:block}
.brand h2{color:var(--orange);font-size:20px}.brand small{font-size:10px}
.nav-right{display:flex;gap:10px;align-items:center}
.back,.welcome-btn{border:1px solid var(--orange);border-radius:25px;padding:9px 16px;font-size:12px;font-weight:bold;background:#000;color:var(--orange)}
.languages{display:flex;border:1px solid var(--border);border-radius:30px;overflow:hidden;background:#000}
.languages button{border:0;background:#000;color:var(--orange);padding:9px 16px;font-weight:bold;cursor:pointer;font-size:13px}
.languages button.active{background:var(--orange);color:#000}
.course{border:1px solid var(--border);border-radius:20px;overflow:hidden;background:linear-gradient(145deg,#140600,#020101);cursor:pointer;transition:.3s}
.course:hover{transform:translateY(-5px);border-color:var(--orange);box-shadow:0 0 25px rgba(255,101,0,.2)}
.course-cover{min-height:170px;display:grid;place-items:center;font-size:65px;background:radial-gradient(circle,rgba(255,101,0,.24),transparent 65%),#050100;border-bottom:1px solid var(--border);position:relative}
.course-cover::after{content:"KLIKE POU OUVRI →";position:absolute;bottom:10px;right:12px;font-size:10px;font-weight:bold;background:var(--orange);color:#000;padding:5px 10px;border-radius:15px;opacity:0;transition:.3s}
.course:hover .course-cover::after{opacity:1}
.open-btn{width:100%;margin-top:15px;padding:12px;background:var(--orange);color:#000;border:0;border-radius:10px;font-weight:bold;cursor:pointer}
.modal{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.85);padding:20px}
.modal.active{display:grid;place-items:center}
.modal-content{max-width:650px;width:100%;background:linear-gradient(145deg,#140600,#020101);border:2px solid var(--orange);border-radius:20px;padding:30px 25px;position:relative}
.modal-close{position:absolute;top:12px;right:15px;background:#000;border:1px solid var(--orange);color:var(--orange);width:32px;height:32px;border-radius:50%;cursor:pointer}
</style>
</head>
<body>
<!-- HEADER ak video logo PA CHANJE -->
<header>
<div class="nav">
<a href="index.html" class="brand">
<div class="logo"><video autoplay loop muted playsinline><source src="pro-max-academie-II.mp4" type="video/mp4"></video></div>
<div><h2>PRO-MAX ACADÉMIE</h2><small>FORMER AUJOURD'HUI POUR DIRIGER DEMAIN</small></div>
</a>
<div class="nav-right">
<a href="index.html" class="back">← ACADÉMIE</a>
<span class="welcome-btn">WELCOME</span>
<div class="languages"><button data-lang="fr" class="active">FRA</button><button data-lang="en">ENG</button><button data-lang="ht">KRE</button></div>
</div>
</div>
</header>

<!-- COURSE GRID -->
<section style="max-width:1350px;margin:auto;padding:30px 20px 60px">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px">

<article class="course" data-title="COMPÉTENCES NUMÉRIQUES" data-desc="Bases outils numériques" data-icon="💻">
<div class="course-cover">💻</div>
<div style="padding:20px">
<h2 style="color:var(--orange)">COMPÉTENCES NUMÉRIQUES</h2>
<p>Apprendre les bases essentielles des outils numériques...</p>
<button class="open-btn">👁️ OUVRI KOU A</button>
</div>
</article>

<!-- KOPIE MEMM JAN POU 5 LOT KOU YO - AI, LEADERSHIP, MEDIA, BUSINESS, COMMUNITY -->

</div>
</section>

<!-- MODAL KI OUVÈ LE OU KLIKE -->
<div class="modal" id="courseModal">
<div class="modal-content">
<button class="modal-close" id="closeModal">✕</button>
<div style="font-size:60px;text-align:center" id="modalIcon">💻</div>
<h2 id="modalTitle" style="color:var(--orange);text-align:center">TITRE</h2>
<p id="modalDesc" style="text-align:center">Description</p>
<div id="modalModules"></div>
<button style="width:100%;padding:14px;background:var(--orange);color:#000;border:0;border-radius:10px;font-weight:bold;margin-top:15px">🎓 KOMANSE FÒMASYON SA A</button>
</div>
</div>

<script>
// KOUNYA COURSE YO OUVÈ!
const courses=document.querySelectorAll(".course");
const modal=document.getElementById("courseModal");
const modalTitle=document.getElementById("modalTitle");
const closeModal=document.getElementById("closeModal");

function openCourseModal(courseEl){
modalTitle.textContent=courseEl.dataset.title;
document.getElementById("modalIcon").textContent=courseEl.dataset.icon;
modal.classList.add("active");
}
function closeCourseModal(){modal.classList.remove("active");}

courses.forEach(course=>{
course.addEventListener("click",()=>openCourseModal(course));
});
closeModal.addEventListener("click",closeCourseModal);
modal.addEventListener("click",(e)=>{if(e.target===modal) closeCourseModal();});
</script>
</body>
</html>
